services:
  - type: web
    name: alignxagent-api
    env: docker
    rootDir: app/backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: alignxagent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/sql_app.db
      - key: JWT_SECRET_KEY
        sync: false
      - key: MGX_IGNORE_INIT_DATA
        value: "true"
      - key: SUPER_ADMIN_EMAILS
        value: allenni521314@gmail.com
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_DEFAULT_MODEL
        value: deepseek-v4-flash
      - key: AI_LIGHT_MODEL
        value: deepseek-v4-flash
      - key: AI_REASONING_MODEL
        value: deepseek-v4-pro
      - key: AI_DEEP_MODEL
        value: deepseek-v4-pro
      - key: AI_PRICE_DEEPSEEK_V4_FLASH_INPUT_CNY_PER_1M
        value: "1.008"
      - key: AI_PRICE_DEEPSEEK_V4_FLASH_OUTPUT_CNY_PER_1M
        value: "2.016"
      - key: AI_PRICE_DEEPSEEK_V4_PRO_INPUT_CNY_PER_1M
        value: "3.132"
      - key: AI_PRICE_DEEPSEEK_V4_PRO_OUTPUT_CNY_PER_1M
        value: "6.264"
      - key: SILICONFLOW_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: AI_EMBEDDING_MODEL
        value: BAAI/bge-m3
      - key: EMBEDDING_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: EMBEDDING_API_KEY
        sync: false
      - key: RERANK_MODEL
        value: BAAI/bge-reranker-v2-m3
      - key: RERANK_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: RERANK_API_KEY
        sync: false
      - key: VISION_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: VISION_API_KEY
        sync: false
      - key: AI_VISION_MODEL
        value: qwen2.5-vl-72b-instruct
      - key: AI_PRICE_QWEN2_5_VL_72B_INSTRUCT_INPUT_CNY_PER_1M
        value: "16.5168"
      - key: AI_PRICE_QWEN2_5_VL_72B_INSTRUCT_OUTPUT_CNY_PER_1M
        value: "49.5432"
