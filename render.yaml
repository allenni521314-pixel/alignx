# AlignX V2 — Render deployment config
services:
  # Backend API
  - type: web
    name: alignx-api
    env: python
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: SCRAPERAPI_KEY
        sync: false
      - key: SCRAPERAPI_BASE_URL
        value: https://api.scraperapi.com
      - key: QWEN_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: deepseek

  # Frontend static site
  - type: web
    name: alignx-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://alignx-api.onrender.com
