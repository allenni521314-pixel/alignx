services:
  - type: web
    name: alignxagent-api
    env: docker
    rootDir: app/backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: alignxagent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/sql_app.db
      - key: JWT_SECRET_KEY
        sync: false
      - key: MGX_IGNORE_INIT_DATA
        value: "true"
      - key: SUPER_ADMIN_EMAILS
        value: allenni521314@gmail.com
      - key: EMAIL_CODE_DEBUG
        value: "true"
      - key: AI_PROVIDER
        value: qwen
      - key: AI_API_MODE
        value: chat
      - key: OPENAI_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_DEFAULT_MODEL
        value: qwen3-32b
      - key: AI_LIGHT_MODEL
        value: qwen3-32b
      - key: AI_REASONING_MODEL
        value: qwen3-32b
      - key: AI_DEEP_MODEL
        value: qwen3-32b
      - key: VISION_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: VISION_API_KEY
        sync: false
      - key: AI_VISION_MODEL
        value: qwen3-vl-plus
      - key: HERMES_AGENT_URL
        value: http://127.0.0.1:9120
      - key: HERMES_AGENT_TIMEOUT
        value: "900"
      - key: HERMES_TUI_TOOLSETS
        value: browser
      - key: HERMES_MODEL_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: HERMES_MODEL_NAME
        value: qwen3-32b
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: BROWSERBASE_PROJECT_ID
        sync: false
      - key: BROWSERBASE_PROXIES
        value: "true"
      - key: BROWSERBASE_ADVANCED_STEALTH
        value: "false"
