services:
  - type: web
    name: alignxagent-api
    env: docker
    rootDir: app/backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: alignxagent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/sql_app.db
      - key: JWT_SECRET_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_DEFAULT_MODEL
        sync: false
      - key: VISION_BASE_URL
        sync: false
      - key: VISION_API_KEY
        sync: false
      - key: AI_VISION_MODEL
        sync: false
