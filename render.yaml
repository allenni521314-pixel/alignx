# AlignX — Render deployment config
services:
  # Backend API
  - type: web
    name: alignxagent-api
    env: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./alignx_v2.db
      - key: DATABASE_URL_SYNC
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: SCRAPERAPI_KEY
        sync: false
      - key: SCRAPERAPI_BASE_URL
        value: https://api.scraperapi.com
      - key: QWEN_API_KEY
        value: sk-nujvwdljnmknhkiwubesnzvzohdseysyxaofygdcwxudagid
      - key: QWEN_BASE_URL
        value: https://api.siliconflow.cn/v1
      - key: QWEN_MODEL
        value: Qwen/Qwen2.5-VL-72B-Instruct
      - key: AUTH_SECRET_KEY
        sync: false
      - key: AI_PROVIDER
        value: deepseek
      - key: AMAZON_CAPTURE_PROVIDER
        value: scraperapi
      - key: ENVIRONMENT
        value: prod
      - key: ENABLE_TEMP_LOGIN_CODE
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SENDGRID_API_KEY
        sync: false
      - key: REPORT_FROM_EMAIL
        value: report@alignx.io
      - key: REPORT_FROM_NAME
        value: AlignX
      - fromGroup: alignx-report-push

  # Frontend static site
  - type: web
    name: alignx-vi
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://alignxagent-api.onrender.com
      - key: PNPM_CONFIG_FROZEN_LOCKFILE
        value: "false"

  # Daily report push
  - type: cron
    name: alignx-daily-report-push
    runtime: python
    rootDir: backend
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.jobs.trigger_daily_report_push
    envVars:
      - key: ALIGNX_API_BASE
        value: https://alignxagent-api.onrender.com
      - fromGroup: alignx-report-push

envVarGroups:
  - name: alignx-report-push
    envVars:
      - key: REPORT_PUSH_TOKEN
        generateValue: true
