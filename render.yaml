services:
  - type: web
    name: alignxagent-api
    env: docker
    rootDir: app/backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: alignxagent-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: prod
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////data/sql_app.db
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_API_MODE
        value: chat
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_DEFAULT_MODEL
        value: deepseek-v4-pro
      - key: AI_LIGHT_MODEL
        value: deepseek-v4-flash
      - key: AI_REASONING_MODEL
        value: deepseek-v4-pro
      - key: AI_DEEP_MODEL
        value: deepseek-v4-pro
      - key: VISION_PROVIDER
        value: qwen
      - key: VISION_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: VISION_API_KEY
        sync: false
      - key: AI_VISION_MODEL
        value: qwen3-vl-plus
      - key: VISION_REQUEST_TIMEOUT
        value: "180"
