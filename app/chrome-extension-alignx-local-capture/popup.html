<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AlignX Capture</title>
    <style>
      body {
        width: 360px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #102f27;
        background: #f7faf8;
      }
      .wrap {
        padding: 16px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      p {
        margin: 0;
        color: #657084;
        font-size: 12px;
        line-height: 1.5;
      }
      button {
        width: 100%;
        height: 42px;
        border: 0;
        border-radius: 8px;
        background: #134e42;
        color: white;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 14px;
      }
      button.secondary {
        background: white;
        color: #134e42;
        border: 1px solid #c9d8d3;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      label {
        display: block;
        margin-top: 12px;
        color: #657084;
        font-size: 12px;
        font-weight: 700;
      }
      select {
        width: 100%;
        height: 40px;
        margin-top: 6px;
        border: 1px solid #c9d8d3;
        border-radius: 8px;
        background: white;
        color: #102f27;
        font-size: 13px;
        font-weight: 700;
        padding: 0 10px;
      }
      .box {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid #dce6e2;
        border-radius: 8px;
        background: white;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
        margin-top: 8px;
      }
      .key {
        color: #657084;
      }
      .val {
        font-weight: 700;
        text-align: right;
        word-break: break-all;
      }
      .status {
        margin-top: 10px;
        color: #9a5a00;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>AlignX 本地采集</h1>
      <p>在 Amazon 商品详情页点击采集。插件只读取当前已打开页面，不自动批量访问。</p>
      <button id="capture">采集当前 Amazon 页面</button>
      <label for="target">采集后发送到</label>
      <select id="target">
        <option value="listing">本品诊断</option>
        <option value="competitor">竞品诊断</option>
        <option value="asin">ASIN选品</option>
      </select>
      <button id="open" class="secondary">发送到 AlignX</button>
      <div id="result" class="box" hidden></div>
      <div id="status" class="status"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
